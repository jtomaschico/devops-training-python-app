name: CI-CD

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Run Continuous Deployment'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: "scalian_training-python-app"
  APP_URL: "http://localhost:5001/"
  REGISTRY: ${{ vars.REGISTRY_HOST }}
  ARTIFACTORY: ${{ vars.ARTIFACTORY_URL }}
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'PRO' || 'DEV' }}

jobs:

  # =========================
  # CI
  # =========================
  ci:
    name: Continuous Integration
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar contexto
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Deploying to $DEPLOY_ENV"

      # ✅ Mejor práctica: instalar Python aislado
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Run tests
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pytest -q

      # ✅ Build solo una vez en CI
      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $IMAGE_NAME:$IMAGE_TAG -f devops/Dockerfile .
          echo "Imagen construida: $IMAGE_NAME:$IMAGE_TAG"

      # ✅ Login a GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ✅ Push imagen
      - name: Push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $FULL_IMAGE_NAME
          docker push $FULL_IMAGE_NAME


  # =========================
  # CD
  # =========================
  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ (github.ref_name == 'develop' || github.ref_name == 'main') && github.event_name == 'workflow_dispatch' && inputs.RUN_CD == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull image from GHCR
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME:$IMAGE_TAG
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull $FULL_IMAGE_NAME

      - name: Deploy
        run: |
          docker compose up -d

      - name: Wait for app
        run: sleep 5

      - name: Test E2E
        run: curl -fsS $APP_URL

      - name: Cleanup
        if: always()
        run: docker compose down --volumes || true
          

          

   
